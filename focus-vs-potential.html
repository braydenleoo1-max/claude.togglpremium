<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focus vs Potential</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#14181f;--mut:#6b7480;--line:#dde2e8;--foc:#0f8b6d;--pot:#5b6cff;--potbg:rgba(91,108,255,.13);--bad:#d6453d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1217;--card:#181c23;--tx:#e8ebf0;--mut:#8b94a1;--line:#272d37;--foc:#34d3a4;--pot:#8d99ff;--potbg:rgba(141,153,255,.16);--bad:#ff7b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1217;--card:#181c23;--tx:#e8ebf0;--mut:#8b94a1;--line:#272d37;--foc:#34d3a4;--pot:#8d99ff;--potbg:rgba(141,153,255,.16);--bad:#ff7b72;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:16px;max-width:980px;margin:0 auto}
h1{font-size:20px;margin:4px 0 14px;letter-spacing:-.01em}
.timers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.timers{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:14px;margin:0 0 2px;color:var(--mut);font-weight:600}
.big{font-size:clamp(38px,9vw,56px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
#fc .big{color:var(--foc)}#pc .big{color:var(--pot)}
.sub{color:var(--mut);font-size:13px;min-height:19px}
.bar{height:8px;border-radius:4px;background:var(--potbg);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--foc);width:0;transition:width .6s}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);margin:10px 0}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;margin:0 6px 6px 0}
button:focus-visible{outline:2px solid var(--pot);outline-offset:2px}
button.go{background:var(--foc);border-color:var(--foc);color:#fff}
button.stop{color:var(--bad);border-color:var(--bad)}
button.lnk{border:0;background:none;color:var(--mut);font-weight:500;padding:4px 0;text-decoration:underline}
.nav{display:flex;align-items:center;gap:6px;margin:20px 0 8px;flex-wrap:wrap}
.nav h2{font-size:16px;margin:0 8px 0 0}
.nav button{padding:6px 12px;margin:0}
.key{color:var(--mut);font-size:12px;margin-left:auto}
.key b{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 3px 0 8px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.in{min-width:640px}
.row{display:grid;grid-template-columns:42px repeat(7,1fr)}
.head button{margin:0;border-radius:0;border:0;border-left:1px solid var(--line);background:none;padding:8px 4px;font-weight:500;font-size:13px;line-height:1.3}
.head button.sel{background:var(--potbg)}
.head small{display:block;color:var(--mut);font-weight:400}
#cb{max-height:380px;overflow-y:auto;border-top:1px solid var(--line)}
.col{position:relative;height:960px;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,var(--line) 39px,var(--line) 40px)}
.hrs{position:relative;height:960px}
.hrs span{position:absolute;right:6px;font-size:11px;color:var(--mut)}
.pb{position:absolute;left:0;right:0;background:var(--potbg)}
.b{position:absolute;left:12%;right:4%;min-height:3px;background:var(--foc);border-radius:4px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 12px}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}}
.stats .card{padding:12px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{color:var(--mut);font-size:13px}
.ent{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ent .t{font-variant-numeric:tabular-nums;color:var(--mut);min-width:110px}
.ent .d{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.ent button{padding:2px 8px;margin:0;border:0;background:none;color:var(--mut)}
.empty{color:var(--mut);padding:14px 0}
.note{color:var(--mut);font-size:13px;margin:18px 0 8px}
</style>
</head>
<body>
<h1>Focus vs Potential</h1>
<div class="timers">
  <div class="card" id="fc">
    <h2>Focus</h2>
    <div class="big" id="fT">0:00:00</div>
    <div class="sub" id="fS"></div>
    <input id="lbl" placeholder="What are you working on?" maxlength="60" autocomplete="off">
    <div id="ctl"></div>
  </div>
  <div class="card" id="pc">
    <h2>Potential (runs until you’re done)</h2>
    <div class="big" id="pT">0:00:00</div>
    <div class="sub" id="pS"></div>
    <div class="bar"><i id="bar"></i></div>

  </div>
</div>

<div class="nav">
  <h2 id="wl"></h2>
  <button data-a="prev" aria-label="Previous week">‹</button>
  <button data-a="today">Today</button>
  <button data-a="next" aria-label="Next week">›</button>
  <span class="key"><b style="background:var(--foc)"></b>Focus<b style="background:var(--potbg);border:1px solid var(--pot)"></b>Potential</span>
</div>
<div class="wrap"><div class="in"><div class="row head" id="ch"></div><div id="cb"></div></div></div>

<div class="nav"><h2 id="ll"></h2></div>
<div class="stats" id="st"></div>
<div class="card" id="lg"></div>
<p class="note">Everything is saved on this device. For lock-screen Pause/Resume, open this page in Chrome or Safari, add it to your Home Screen, and press Start once so the phone’s media controls appear.</p>

<script>
const $=s=>document.querySelector(s),H=40,K='focuspot.v2';
let S={};try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S.e=S.e||[];S.pot=S.pot||[];S.ses=S.ses||[];S.run=S.run||null;S.last=S.last||null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));return Math.floor(ms/3600)+':'+p2(Math.floor(ms/60)%60)+':'+p2(ms%60)};
const short=ms=>{const m=Math.round(ms/6e4);return m>=60?Math.floor(m/60)+'h '+p2(m%60)+'m':m+'m'};
const tm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const dayAdd=(t,n)=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n).getTime()};
const wkStart=t=>{const d=new Date(dayAdd(t,0));return dayAdd(d.getTime(),-((d.getDay()+6)%7))};
const ov=(a,b,x,y)=>Math.max(0,Math.min(b,y)-Math.max(a,x));
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sel=dayAdd(Date.now(),0),firstScroll=true;

const live=()=>S.run&&S.run.cur?[{s:S.run.cur,e:Date.now(),l:S.run.label}]:[];
const segs=()=>S.e.concat(live());
const focusDay=d0=>segs().reduce((a,x)=>a+ov(x.s,x.e,d0,dayAdd(d0,1)),0);
const potDay=d0=>S.pot.reduce((a,x)=>a+ov(x.s,x.e||Date.now(),d0,dayAdd(d0,1)),0);
const focusRun=()=>S.run?S.run.acc+(S.run.cur?Date.now()-S.run.cur:0):0;
const potRun=()=>S.run?Date.now()-S.run.ps:0;
const rate=()=>{const p=potRun();return p>0?Math.min(1,focusRun()/p):1};

/* silent audio so the phone shows lock-screen media controls */
function silence(){const n=40000,b=new Uint8Array(44+n).fill(128),w=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0)),d=new DataView(b.buffer);
w(0,'RIFF');d.setUint32(4,36+n,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,'data');d.setUint32(40,n,true);
let s='';b.forEach(v=>s+=String.fromCharCode(v));return 'data:audio/wav;base64,'+btoa(s)}
const au=new Audio();au.loop=true;try{au.src=silence()}catch(e){}
const play=()=>{try{au.play().catch(()=>{})}catch(e){}};
function media(){if(!('mediaSession' in navigator))return;const r=S.run;
try{navigator.mediaSession.metadata=new MediaMetadata({title:r?(r.cur?'Focusing ':'Paused ')+fmt(focusRun()):'Focus timer',artist:'Potential '+fmt(potRun()),album:'Focus vs Potential'});
navigator.mediaSession.playbackState=r&&r.cur?'playing':'paused'}catch(e){}}
try{const m=navigator.mediaSession;
m.setActionHandler('play',()=>{play();act('resume')});
m.setActionHandler('pause',()=>act('pause'));
m.setActionHandler('stop',()=>act('pause'))}catch(e){}
document.addEventListener('pointerdown',()=>{if(S.run&&au.paused)play()});

function act(a,el){const n=Date.now(),r=S.run;
if(a==='start'&&!r){S.run={k:n,label:$('#lbl').value.trim(),acc:0,cur:n,ps:n};S.pot.push({s:n,e:null,k:n});play()}
else if(a==='pause'&&r&&r.cur){S.e.push({s:r.cur,e:n,l:r.label,k:r.k});r.acc+=n-r.cur;r.cur=null}
else if(a==='resume'&&r&&!r.cur){r.cur=n;play()}
else if(a==='done'&&r){if(r.cur){S.e.push({s:r.cur,e:n,l:r.label,k:r.k});r.acc+=n-r.cur}S.pot.forEach(x=>{if(x.k===r.k)x.e=n});S.ses.push({k:r.k,s:r.ps,e:n,f:r.acc,l:r.label});S.last={f:r.acc,p:n-r.ps};S.run=null;$('#lbl').value='';try{au.pause()}catch(e){}}

else if(a==='prev')sel=dayAdd(sel,-7);
else if(a==='next')sel=dayAdd(sel,7);
else if(a==='today')sel=dayAdd(n,0);
else if(a==='day')sel=+el.dataset.d;
else if(a==='del'){const k=+el.dataset.k;S.e=S.e.filter(x=>x.k!==k);S.pot=S.pot.filter(x=>x.k!==k);S.ses=S.ses.filter(x=>x.k!==k)}
save();all()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el)});

function ctl(){const r=S.run;
$('#ctl').innerHTML=(!r?'<button class="go" data-a="start">Start both clocks</button>':(r.cur?'<button data-a="pause">Pause</button>':'<button class="go" data-a="resume">Resume</button>')+'<button class="stop" data-a="done">Done · log session</button>');
$('#lbl').disabled=!!r;if(r)$('#lbl').value=r.label||''}

function tick(){const r=S.run,L=S.last,pc=Math.round(rate()*100);
$('#fT').textContent=fmt(focusRun());
$('#pT').textContent=fmt(potRun());
$('#fS').textContent=r?(r.cur?'Running':'Paused · resume to keep going')+(r.label?' · '+r.label:''):'Pause whenever you get distracted';
$('#pS').textContent=r?'Time used: '+pc+'%':L?'Last session: '+short(L.f)+' of '+short(L.p)+' focused · '+(L.p?Math.round(L.f/L.p*100):100)+'%':'Starts together with your focus clock';
$('#bar').style.width=(r?pc:L&&L.p?Math.round(L.f/L.p*100):0)+'%'}

function cal(){const ws=wkStart(sel),n=Date.now(),old=$('#cb').firstChild?$('#cb').scrollTop:null;
let head='<div></div>',cols='<div class="hrs">'+Array.from({length:24},(_,i)=>i?`<span style="top:${i*H-7}px">${p2(i)}:00</span>`:'').join('')+'</div>';
for(let i=0;i<7;i++){const d0=dayAdd(ws,i),d1=dayAdd(d0,1),d=new Date(d0),f=focusDay(d0);
head+=`<button data-a="day" data-d="${d0}" class="${d0===sel?'sel':''}">${d.toLocaleDateString(undefined,{weekday:'short'})} ${d.getDate()}<small>${f?short(f):'–'}</small></button>`;
let c='';const box=(a,b,cls,t)=>{a=Math.max(a,d0);b=Math.min(b,d1);if(b>a)c+=`<div class="${cls}" style="top:${(a-d0)/36e5*H}px;height:${(b-a)/36e5*H}px"${t?` title="${esc(t)}"`:''}></div>`};
S.pot.forEach(x=>box(x.s,x.e||n,'pb'));
segs().forEach(x=>box(x.s,x.e,'b',(x.l||'Focus')+' · '+tm(x.s)+'–'+tm(x.e)));
if(n>=d0&&n<d1)c+=`<div class="now" style="top:${(n-d0)/36e5*H}px"></div>`;
cols+=`<div class="col">${c}</div>`}
$('#ch').innerHTML=head;$('#cb').innerHTML=`<div class="row">${cols}</div>`;
if(old!==null)$('#cb').scrollTop=old;else if(firstScroll){$('#cb').scrollTop=Math.max(0,(new Date().getHours()-3)*H);firstScroll=false}
const a=new Date(ws),b=new Date(dayAdd(ws,6));
$('#wl').textContent=a.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' – '+b.toLocaleDateString(undefined,{month:'short',day:'numeric'})}

function log(){const d0=sel,d1=dayAdd(d0,1),f=focusDay(d0),p=potDay(d0);
$('#ll').textContent=new Date(d0).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
$('#st').innerHTML=[['Focused',short(f)],['Potential',short(p)],['Time used',p?Math.round(f/p*100)+'%':'–'],['Not focused',short(Math.max(0,p-f))]].map(x=>`<div class="card"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
const rows=S.ses.filter(x=>ov(x.s,x.e,d0,d1)>0).sort((a,b)=>b.s-a.s);
$('#lg').innerHTML=rows.length?rows.map(x=>`<div class="ent"><span class="t">${tm(x.s)} – ${tm(x.e)}</span><span>${esc(x.l)||'Session'}</span><span class="d">${short(x.f)} of ${short(x.e-x.s)} · ${Math.round(x.f/(x.e-x.s||1)*100)}%</span><button data-a="del" data-k="${x.k}" aria-label="Delete session">✕</button></div>`).join(''):'<div class="empty">No finished sessions this day. Press Start, then Done to log one.</div>'}

function all(){ctl();tick();cal();log();media()}
all();
setInterval(tick,1000);
setInterval(media,5000);setInterval(()=>{cal();log()},15000);
</script>
</body>
</html>
